#cloud-config
# Rendered by Terraform's templatefile(). Read carefully before editing:
#   a dollar sign + {name} is replaced by Terraform;
#   doubling the dollar sign escapes it back to a literal for the shell.
#   Plain $VAR and $(cmd) are NOT special to HCL and need no escaping.
#
# Mirrors the CloudWeaver `hermes-host` recipe: Hermes installed on the host by
# the official installer, with the agent's own terminal actions confined to a
# Docker sandbox. No web terminal, no HTTP port — SSH only.
#
# The bot token and the LLM provider are deliberately NOT configured here: that
# is done live with the participants during the workshop, via `hermes setup`.

package_update: true
locale: pt_BR.UTF-8
timezone: America/Sao_Paulo

# Password auth is deliberately OFF over SSH: the VM sits on a public IP with
# port 22 open to the world, and a password there invites brute force. The root
# password still exists (see chpasswd below) and still works on the web console
# of the Locaweb panel, which is not exposed to the internet — that is the
# recovery path if a participant loses the SSH key.
ssh_pwauth: false
disable_root: false

packages:
  - curl
  - ca-certificates
  - gnupg
  - jq

chpasswd:
  expire: false
  list: |
    root:${root_password}

write_files:
  - path: /etc/ssh/sshd_config.d/99-hermes-lab.conf
    permissions: "0644"
    owner: root:root
    content: |
      # prohibit-password = root may log in, but only with a key.
      PermitRootLogin prohibit-password
      PasswordAuthentication no

  - path: /etc/systemd/resolved.conf.d/dns.conf
    permissions: "0644"
    owner: root:root
    content: |
      [Resolve]
      DNS=8.8.8.8 8.8.4.4 1.1.1.1
      FallbackDNS=1.1.1.1 1.0.0.1

  # Polled over SSH by `make up` and `make status`.
  - path: /usr/local/bin/hermes-lab-status
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/sh
      cat /var/lib/hermes-lab/status 2>/dev/null || echo "aguardando cloud-init"

  - path: /root/COMECE-AQUI.txt
    permissions: "0644"
    owner: root:root
    content: |
      Laboratório Hermes — TDC São Paulo
      ==================================

      Acesso por SSH é só com chave. A senha de root existe, mas vale apenas
      no console web do painel da Locaweb — é o resgate caso você perca a
      chave. Ela está no arquivo CREDENCIAIS.txt, na pasta do repositório.

      A VM já tem o Hermes Agent instalado no host e o Docker configurado como
      sandbox do terminal do agente. O que falta é a configuração, que fazemos
      juntos no workshop:

        1. hermes setup          # provedor de LLM e GitHub
        2. hermes                # abre o agente no terminal

      Para ligar o bot do Telegram (opcional, também no workshop):

        3. printf 'TELEGRAM_BOT_TOKEN=SEU_TOKEN\nTELEGRAM_ALLOWED_USERS=12345678\n' >> /root/.hermes/.env
           chmod 600 /root/.hermes/.env
           hermes gateway restart

      O gateway JÁ ESTÁ RODANDO desde que a VM subiu, como serviço de usuário
      do systemd. Por isso é 'restart': ele precisa reler o .env.

      O TELEGRAM_BOT_TOKEN é o que o @BotFather devolve ao criar o bot. O
      TELEGRAM_ALLOWED_USERS é o seu id numérico do Telegram, não o @username —
      para descobrir, fale com o @userinfobot no próprio Telegram.

      Cofounder
      ---------

      Esta VM já vem com tudo o que o instalador do Cofounder baixa: podman,
      mise, gh, os toolchains do Node e as bibliotecas do Chromium. Quando
      você rodar o instalador, ele vai reconhecer cada um e pular direto para
      a configuração do projeto — questão de segundos, não de minutos.

      Rode SEMPRE de dentro da pasta do projeto. Em $HOME ele instala só as
      ferramentas (que já estão aqui) e não configura projeto nenhum:

        mkdir -p ~/meu-app && cd ~/meu-app
        /bin/bash -c "$(curl -fsSL https://cofounder.locaweb.com.br/install.sh)"

      Atenção: ao terminar, o 'hermes setup' sugere na tela o comando
      'hermes gateway'. Se você rodar, vai ver um erro em vermelho dizendo
      'a gateway is already running under systemd (user)'. Não é problema
      nenhum — é a CLI impedindo que suba um segundo gateway por cima do
      que já existe. Use 'hermes gateway status' para ver o estado e
      'hermes gateway restart' para reiniciar.

      Diagnóstico:

        hermes --version
        hermes gateway status                   # estado do gateway
        hermes logs                             # logs do agente
        hermes config get terminal.backend      # deve responder: docker
        docker info
        systemctl --user list-units | grep -i hermes   # o gateway roda no escopo de USUÁRIO
        tail -f /var/log/hermes-lab.log         # log desta instalação

runcmd:
  - |
    # Everything below is logged where `make logs` can find it.
    exec >> /var/log/hermes-lab.log 2>&1
    set -x

    mkdir -p /var/lib/hermes-lab
    say() { echo "$1" > /var/lib/hermes-lab/status; }
    fail() { echo "ERRO: $1" > /var/lib/hermes-lab/status; exit 1; }

    # 1) Docker Engine from the official repo. NOT the snap and NOT docker.io:
    #    the snap build breaks the --init / no-new-privileges flags that the
    #    Hermes terminal sandbox relies on.
    say "1/5 instalando Docker"
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc || fail "download da chave GPG do Docker"
    chmod a+r /etc/apt/keyrings/docker.asc
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
    apt-get update -qq || fail "apt-get update"
    apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin || fail "instalação do Docker"
    systemctl enable --now docker

    # 2) Hermes Agent, official installer. Takes 5-15 min: it builds a managed
    #    Python + Node environment and downloads Playwright/Chromium.
    #    --skip-setup/--non-interactive because there is no TTY in cloud-init;
    #    the wizard is the participant's job, live.
    say "2/5 instalando Hermes Agent (leva de 5 a 15 minutos)"
    curl -fsSL https://hermes-agent.nousresearch.com/install.sh \
      | bash -s -- --skip-setup --non-interactive --skip-computer-use --no-skills \
      || fail "instalação do Hermes Agent"

    # 3) Confine the agent's terminal/execute_code/file actions to a container.
    say "3/5 configurando o sandbox do terminal"
    /usr/local/bin/hermes config set terminal.backend docker || fail "hermes config set terminal.backend"
    /usr/local/bin/hermes config set terminal.container_cpu ${sandbox_cpu}
    /usr/local/bin/hermes config set terminal.container_memory ${sandbox_memory_mb}

    # Installs and starts the gateway as a systemd USER service (note: plain
    # `systemctl` will not show it; it needs `systemctl --user`). It comes up
    # even with no bot token in /root/.hermes/.env — there is simply no
    # Telegram transport to serve until the participant adds one and runs
    # `hermes gateway restart`.
    /usr/local/bin/hermes gateway install || true

    # 4) Warm up what the Cofounder installer would otherwise download live, in
    #    front of the room. This block mirrors the machine-level half of
    #    https://cofounder.locaweb.com.br/install.sh — same tools, same targets —
    #    so its idempotency guards (`have podman`, the libnspr4/libnss3 canary in
    #    ldconfig, ...) all hit and the participant's run skips straight to the
    #    per-project `npx skills add`.
    #
    #    Nothing here is fatal: the Cofounder is an accelerator, the lab is
    #    Hermes. If the GitHub CLI repo is down during the event, the VM must
    #    still reach "5/5 pronto".
    say "4/5 preparando as dependências do Cofounder"
    warn() { echo "AVISO: $1 falhou — o install.sh do Cofounder refaz esta parte"; }

    # cloud-init does not guarantee HOME, and both mise.run and the PATH line
    # below resolve their target from it.
    export HOME=/root
    export DEBIAN_FRONTEND=noninteractive

    # podman. Deliberately NOT podman-docker: that package ships a
    # /var/run/docker.sock shim that would fight the Docker Engine the Hermes
    # terminal sandbox runs on.
    apt-get install -y -qq podman || warn "instalação do podman"

    # gh, from the GitHub CLI apt repo — the same source the installer uses.
    install -m 0755 -d /etc/apt/keyrings
    if curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg; then
      chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
      apt-get update -qq && apt-get install -y -qq gh || warn "instalação do gh"
    else
      warn "download da chave GPG do GitHub CLI"
    fi

    # mise, into /root/.local/bin. mise.run only prints PATH instructions, so we
    # persist the export ourselves — byte for byte the line the installer greps
    # for, or it would append a second copy.
    if [ ! -x /root/.local/bin/mise ]; then
      curl -fsSL https://mise.run | sh || warn "instalação do mise"
    fi
    PATH_LINE='export PATH="$HOME/.local/bin:$PATH"'
    touch /root/.bashrc
    grep -qsxF "$PATH_LINE" /root/.bashrc || echo "$PATH_LINE" >> /root/.bashrc
    export PATH="/root/.local/bin:$PATH"

    # The heavy download the participant will no longer wait for. Both versions:
    # the installer asks for node@24 for Playwright and node@lts for the skills.
    mise install node@lts node@24 || warn "download dos toolchains node pelo mise"

    # System libraries for headless Chromium. Delegated to Playwright's own
    # install-deps so the package list tracks the distro (Ubuntu 24.04+ uses the
    # t64-suffixed names). Version pinned to match the installer.
    mise x node@24 -- npx --yes playwright@1.50.1 install-deps chromium \
      || warn "dependências de sistema do Chromium"

    say "5/5 pronto"
    touch /var/lib/hermes-lab/ready
