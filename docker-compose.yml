services:
  terraform:
    build:
      context: .
      dockerfile: Dockerfile
    image: terraform-hermes-lab:1.14
    container_name: terraform-hermes-lab
    working_dir: /workspace
    volumes:
      # :Z relabels the bind mount for Linux. Without it, podman on
      # hands the container a $HOME-labelled tree it cannot read and
      # every terraform command dies with "Failed to read module directory".
      # compatible Docker and Podman
      - .:/workspace:Z
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 9.9.9.9
    # Event Wi-Fi drops UDP: the Go resolver defaults to 2 attempts / 5s and
    # gives up with "i/o timeout" mid-apply. Retry harder, fail slower.
    dns_opt:
      - timeout:3
      - attempts:5
    stdin_open: true
    tty: true
    command: terraform
